<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#28446e" />
    <meta name="description" content="折れ線グラフをカメラで読み取り、正解との一致率を表示します。" />
    <title>触れる折れ線グラフ</title>
    <link rel="stylesheet" href="./styles.css?v=7" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <h1 id="page-title">触れる折れ線グラフ</h1>
      </header>

      <section id="missing-graph" class="panel chooser" hidden>
        <p class="step-label">MUSEUM GRAPH CHALLENGE</p>
        <h2>グラフのQRコードを読み取ってください</h2>
        <p class="lead">展示されているグラフごとのQRコードから、撮影画面を直接開けます。</p>
      </section>

      <section id="experience" hidden>
        <div class="experience-heading">
          <h2 id="graph-name" class="graph-name"></h2>
          <p>4隅のマーカーがすべて映るようにしてください</p>
        </div>

        <section id="intro" class="intro">
          <div class="camera-placeholder">
            <div class="placeholder-corners" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
            <p>紙を平らな場所に置き<br />真上から撮影します</p>
            <button id="start-camera" class="primary-button" type="button">カメラを起動</button>
          </div>
          <input id="photo-input" class="diagnostic-photo-input" type="file" accept="image/*" tabindex="-1" aria-hidden="true" />
          <p class="privacy-note">写真は端末内だけで処理し、保存・送信しません</p>
        </section>

        <section id="camera-panel" class="camera-panel" hidden>
          <div class="camera-stage">
            <video id="camera" playsinline muted></video>
            <div class="alignment-guide" aria-hidden="true">
              <i></i><i></i><i></i><i></i>
              <span>紙の4隅のマーカーを入れてください</span>
            </div>
          </div>
          <p id="camera-message" class="camera-message">4隅のマーカーを映すと自動で採点します</p>
        </section>

        <section id="result" class="panel result" hidden aria-live="polite">
          <p class="step-label">RESULT</p>
          <div class="score-wrap">
            <span id="score" class="score">--</span><span class="percent">%</span>
          </div>
          <p class="score-caption">総合正答率</p>
          <div class="score-breakdown" aria-label="採点の内訳">
            <div>
              <span>上下・左右の向き</span>
              <strong id="direction-score">--%</strong>
            </div>
            <div>
              <span>場所の正しさ</span>
              <strong id="position-score">--%</strong>
            </div>
          </div>
          <h2 id="result-title">判定結果</h2>
          <p id="result-message" class="lead"></p>
          <div class="result-image">
            <canvas id="result-canvas"></canvas>
            <div class="legend"><span class="answer">正解</span></div>
          </div>
          <div class="button-row">
            <button id="retry" class="secondary-button" type="button">もう一度</button>
            <button id="toggle-answer" class="primary-button" type="button">正解を表示</button>
          </div>
        </section>
      </section>
    </main>

    <canvas id="work-canvas" hidden></canvas>
    <script src="./app.js?v=24" type="module"></script>
  </body>
</html>
